<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Day Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="box">
        <h1>Perfect Day Planner</h1>
        <p class="small">plan a nice chill day :3</p>

        <hr>

        <!--progress bar-->
        <div id="progress-area" class="hidden">
            <div class="bar-outside">
                <div id="bar-inside" class="bar-inside"></div>
            </div>
            <p class="small" id="step-label">quetion 1</p>
        </div>

        <!--welc!-->
        <div id="welcome" class="screen">
            <div class="picture"><img src="https://i.pinimg.com/736x/ca/11/00/ca1100fedd6617d0018196e32e1032a5.jpg"></div>
            <p class="small">welcome! :></p>

            <h2>Plan Your Perfect Day</h2>
            <p>Pick where you want to go, what you want to eat, and what you want to do. At the end you get a summary of your day and a list of what to bring!</p>

            <button class="main-button" onclick="startPlanner()">Start Planning!</button>
        </div>

        //question 1 - date
    </div>

</body>

</html>
